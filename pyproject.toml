[project]
name = "friday"
version = "0.1.0"
description = "Friday: a voice-first personal assistant built on a Hermes Agent fork"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.0,<2",
    "kokoro-onnx>=0.4,<1",
    "mistral-common[audio]>=1.8,<2",
    "mlx-audio>=0.6.4,<0.7",
    "piper-tts>=1.3,<2",
    "sounddevice>=0.5,<1",
    "websockets>=15,<17",
]

[project.scripts]
fridayd = "fridayd.__main__:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday_core", "src/fridayd"]

[dependency-groups]
dev = ["pytest>=8,<10"]
